<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    padding: 48px 56px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
  .sub { color: #86868b; font-size: 17px; font-weight: 400; margin-bottom: 40px; }
  .view { display: none; }
  .view.active { display: block; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Collection cards — Apple TV style */
  #collections { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .collection-card {
    border-radius: 18px;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
    border: none;
    min-height: 220px;
    position: relative;
    overflow: hidden;
    background-size: cover;
    background-position: center;
  }
  .collection-card .c-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.3) 50%, transparent 100%);
  }
  .collection-card .c-text {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 24px;
  }
  .collection-card:hover { transform: translateY(-2px); }
  .collection-card:focus {
    outline: none;
    transform: scale(1.04);
    box-shadow: 0 0 0 4px rgba(0,122,255,.6), 0 12px 40px rgba(0,0,0,.5);
  }
  .collection-card .c-title { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .collection-card .c-count { font-size: 15px; color: rgba(255,255,255,.7); font-weight: 500; }

  /* Deal cards */
  #deals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .deal-card {
    background: #1d1d1f;
    border-radius: 18px;
    padding: 0;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
    overflow: hidden;
  }
  .deal-card:hover { transform: translateY(-2px); }
  .deal-card:focus {
    outline: none;
    transform: scale(1.04);
    box-shadow: 0 0 0 4px rgba(0,122,255,.6), 0 12px 40px rgba(0,0,0,.5);
  }
  .deal-img { width: 100%; height: 200px; object-fit: cover; background: #2c2c2e; }
  .deal-body { padding: 20px 24px 24px 24px; }
  .deal-store { font-size: 13px; font-weight: 600; color: #0a84ff; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .deal-title { font-size: 19px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.35; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .deal-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .deal-price { font-size: 28px; font-weight: 700; letter-spacing: -0.3px; color: #30d158; }
  .deal-was { font-size: 17px; color: #636366; text-decoration: line-through; font-weight: 400; }
  .deal-save { font-size: 13px; font-weight: 600; color: #ff9f0a; background: rgba(255,159,10,.15); padding: 3px 10px; border-radius: 20px; }
  .deal-meta { font-size: 14px; color: #86868b; line-height: 1.5; margin-top: 8px; }

  .back-btn {
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(20px);
    border: none;
    color: #f5f5f7;
    padding: 12px 24px;
    border-radius: 100px;
    cursor: pointer;
    font-size: 17px;
    font-weight: 500;
    margin-bottom: 28px;
    transition: background .2s;
  }
  .back-btn:hover { background: rgba(255,255,255,.18); }
  .back-btn:focus { outline: none; box-shadow: 0 0 0 4px rgba(0,122,255,.6); }
  .hint { margin-top: 40px; color: #636366; font-size: 14px; text-align: center; font-weight: 400; }
</style>
</head>
<body>
<div id="view-home" class="view active">
  <h1>Deals</h1>
  <p class="sub">Handpicked savings, updated daily</p>
  <div id="collections"></div>
</div>

<div id="view-category" class="view">
  <button class="back-btn" id="back-btn" onclick="showHome()">‹ Deals</button>
  <h1 id="cat-title"></h1>
  <p class="sub" id="cat-sub"></p>
  <div id="deals-grid"></div>
</div>

<p class="hint">Use arrow keys to browse · Press Enter to select</p>

  ],
};

document.getElementById('collections').innerHTML = categories.map(c => `
  <div class="collection-card" tabindex="0" data-cat="${c.id}" style="background-image:url('${c.img}')">
    <div class="c-gradient"></div>
    <div class="c-text">
      <div class="c-title">${c.title}</div>
      <div class="c-count">${c.count}</div>
    </div>
  </div>`).join('');

function showHome() {
  document.getElementById('view-category').classList.remove('active');
  document.getElementById('view-home').classList.add('active');
  document.querySelector('.collection-card')?.focus();
}

function openCategory(catId) {
  const cat = categories.find(c => c.id === catId);
  const deals = dealsByCat[catId] || [];
  document.getElementById('cat-title').textContent = cat.title;
  document.getElementById('cat-sub').textContent = deals.length + ' deals';
  document.getElementById('deals-grid').innerHTML = deals.map(d => `
    <div class="deal-card" tabindex="0">
      <img class="deal-img" src="${d.img}" alt="" onerror="this.style.display='none'">
      <div class="deal-body">
        <div class="deal-store">${d.store}</div>
        <div class="deal-title">${d.title}</div>
        <div class="deal-price-row">
          <span class="deal-price">${d.price}</span>
          <span class="deal-was">${d.was}</span>
          <span class="deal-save">${d.save}</span>
        </div>
        <div class="deal-meta">${d.meta}</div>
      </div>
    </div>`).join('');
  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-category').classList.add('active');
  document.querySelector('.deal-card')?.focus();
}

document.querySelectorAll('.collection-card').forEach(card => {
  card.addEventListener('click', () => openCategory(card.dataset.cat));
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') openCategory(card.dataset.cat);
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { showHome(); return; }
  const activeView = document.querySelector('.view.active');
  const cards = [...activeView.querySelectorAll('.collection-card, .deal-card')];
  if (!cards.length) return;
  if (document.activeElement.id === 'back-btn') {
    if (e.key === 'ArrowDown') { e.preventDefault(); cards[0]?.focus(); }
    return;
  }
  const idx = cards.indexOf(document.activeElement);
  const gridEl = activeView.querySelector('#collections, #deals-grid');
  const cols = gridEl ? Math.max(1, Math.floor(gridEl.offsetWidth / 360)) : 1;
  let next = -1;
  if (e.key === 'ArrowRight') next = Math.min(cards.length - 1, idx + 1);
  else if (e.key === 'ArrowLeft') next = Math.max(0, idx - 1);
  else if (e.key === 'ArrowDown') next = Math.min(cards.length - 1, idx + cols);
  else if (e.key === 'ArrowUp') {
    if (idx - cols < 0 && activeView.id === 'view-category') {
      e.preventDefault(); document.getElementById('back-btn').focus(); return;
    }
    next = Math.max(0, idx - cols);
  }
  else return;
  e.preventDefault();
  if (next >= 0) { cards[next].focus(); cards[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
});

document.querySelector('.collection-card').focus();
</script>
