<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial Desk — Breaking News Feed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #e7e9ea; }
  header { background: #000; border-bottom: 1px solid #2f3336; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 20px; font-weight: 800; }
  header h1 span { color: #f4212e; }
  .stats { display: flex; gap: 20px; font-size: 13px; color: #71767b; }
  .stats b { color: #e7e9ea; font-size: 18px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  .feed { border: 1px solid #2f3336; border-radius: 16px; overflow: hidden; }
  .feed-header { padding: 16px 20px; border-bottom: 1px solid #2f3336; font-size: 18px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
  .tweet { display: flex; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #2f3336; transition: background 0.2s; }
  .tweet:hover { background: #080808; }
  .tweet.rejected { opacity: 0.4; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #fff; }
  .tweet-body { flex: 1; min-width: 0; }
  .tweet-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .tweet-name { font-weight: 700; font-size: 15px; }
  .verified { color: #1d9bf0; font-size: 14px; }
  .tweet-handle { color: #71767b; font-size: 14px; }
  .tweet-time { color: #71767b; font-size: 14px; }
  .breaking-badge { background: #f4212e; color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.5px; }
  .tweet-text { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
  .tweet-actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn { border: 1px solid #2f3336; background: transparent; color: #e7e9ea; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 700; transition: all 0.2s; }
  .btn:hover { background: #1a1a1a; }
  .btn-approve { border-color: #00ba7c; color: #00ba7c; }
  .btn-approve:hover { background: #00ba7c22; }
  .btn-approve.active { background: #00ba7c; color: #fff; }
  .btn-reject { border-color: #71767b; color: #71767b; }
  .btn-reject:hover { background: #71767b22; }
  .side-panel { display: flex; flex-direction: column; gap: 20px; }
  .panel { background: #16181c; border-radius: 16px; padding: 20px; }
  .panel h2 { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
  .approved-tweet { padding: 12px 0; border-bottom: 1px solid #2f3336; }
  .approved-tweet:last-child { border-bottom: none; }
  .approved-tweet .text { font-size: 14px; margin-bottom: 4px; }
  .approved-tweet .meta { font-size: 12px; color: #71767b; }
  .push-btn { width: 100%; background: #f4212e; color: #fff; border: none; padding: 14px; border-radius: 24px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 12px; }
  .push-btn:hover { background: #d31a25; }
  .push-btn:disabled { background: #333; cursor: not-allowed; }
  .epg-preview { background: #000; border: 2px solid #f4212e; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .epg-preview .label { background: #f4212e; color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
  .history-item { padding: 10px 0; border-bottom: 1px solid #2f3336; font-size: 13px; }
  .history-item .time { color: #71767b; font-size: 12px; }
  .scan-btn { background: #1d9bf0; color: #fff; border: none; padding: 10px 24px; border-radius: 20px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .scan-btn:hover { background: #1a8cd8; }
  .cat-tabs { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid #2f3336; overflow-x: auto; }
  .cat-tab { background: transparent; border: 1px solid #2f3336; color: #71767b; padding: 6px 16px; border-radius: 16px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .cat-tab.active { background: #e7e9ea; color: #000; border-color: #e7e9ea; }
  .cat-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-left: 6px; }
  .cat-politics { background: #1d9bf022; color: #1d9bf0; }
  .cat-sports { background: #00ba7c22; color: #00ba7c; }
  .cat-tech { background: #794bc422; color: #a37bff; }
  .cat-business { background: #ffaa0022; color: #ffaa00; }
  .cat-world { background: #f4212e22; color: #f4212e; }
  .cat-entertainment { background: #ff6b9d22; color: #ff6b9d; }
</style>
</head>
<body>
<header>
  <h1><span>●</span> Editorial Desk</h1>
  <div style="display:flex;align-items:center;gap:20px;">
    <a href="index.html" style="background:#1d9bf0;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none;font-weight:700;font-size:14px;">← Back to EPG</a>
    <div class="stats">
    <span><b id="stat-pending">0</b> pending</span>
    <span><b id="stat-approved">0</b> approved</span>
    <span><b id="stat-pushed">0</b> pushed</span>
  </div>
  </div>
</header>
<main>
  <div class="feed">
    <div class="feed-header">
      <span>Breaking News Wire</span>
      <button class="scan-btn" onclick="scanFeeds()">↻ Scan</button>
    </div>
    <div class="cat-tabs" id="cat-tabs"></div>
    <div id="tweets"></div>
  </div>
  <div class="side-panel">
    <div class="panel">
      <h2>📺 On EPG Now</h2>
      <div id="epg-live"></div>
      <button class="push-btn" id="push-btn" onclick="pushToEPG()">Push Approved to EPG</button>
    </div>
    <div class="panel">
      <h2>📋 Push History</h2>
      <div id="history"></div>
    </div>
  </div>
</main>
<script>
const SOURCE_COLORS = {
  'CNN': '#cc0000', 'BBC': '#bb1919', 'Fox News': '#003366',
  'Reuters': '#ff8000', 'AP': '#000000', 'MSNBC': '#0066cc',
  'NYT': '#333333', 'NBC': '#0066ff', 'ABC': '#000099', 'CBS': '#003399', 'ESPN': '#cc0000'
};
const SOURCE_HANDLES = {
  'CNN': '@CNN', 'BBC': '@BBCBreaking', 'Fox News': '@FoxNews',
  'Reuters': '@Reuters', 'AP': '@AP', 'MSNBC': '@MSNBC',
  'NYT': '@nytimes', 'NBC': '@NBCNews', 'ABC': '@ABC', 'CBS': '@CBSNews', 'ESPN': '@espn'
};

let tweets = [];
let approvedIds = new Set();
let pushHistory = [];

function load() {
  tweets = JSON.parse(localStorage.getItem('ed_tweets') || '[]');
  approvedIds = new Set(JSON.parse(localStorage.getItem('ed_approved') || '[]'));
  pushHistory = JSON.parse(localStorage.getItem('ed_history') || '[]');
  if (!tweets.length) seedTweets();
  render();
}

function save() {
  localStorage.setItem('ed_tweets', JSON.stringify(tweets));
  localStorage.setItem('ed_approved', JSON.stringify([...approvedIds]));
  localStorage.setItem('ed_history', JSON.stringify(pushHistory));
}

const CATEGORIES = ['All', 'Politics', 'World', 'Business', 'Tech', 'Sports', 'Entertainment'];
let activeCategory = 'All';

function seedTweets() {
  const seed = [
    {source:'CNN', cat:'Business', text:'BREAKING: Federal Reserve announces emergency rate cut amid market turmoil, citing "extraordinary economic conditions"', time:'2m', breaking:true},
    {source:'BBC', cat:'World', text:'Major earthquake strikes Pacific coast. Tsunami warning issued for coastal areas. Authorities urge immediate evacuation.', time:'5m', breaking:true},
    {source:'Reuters', cat:'Tech', text:'Tech giant CEO resigns effective immediately. Board names interim replacement, launches search for permanent successor.', time:'12m', breaking:false},
    {source:'AP', cat:'Politics', text:'Parliament passes landmark climate legislation in late-night session, setting ambitious emissions targets for 2030.', time:'18m', breaking:false},
    {source:'BBC', cat:'Sports', text:'Championship final decided by dramatic penalty shootout. Winning goal scored in 94th minute of extra time.', time:'25m', breaking:false},
    {source:'CNN', cat:'Tech', text:'Scientists report breakthrough in fusion energy, achieving net positive output for sustained 30-second reaction.', time:'32m', breaking:false},
    {source:'Fox News', cat:'Politics', text:'Border security bill advances in Senate committee vote, heads to full floor for debate next week.', time:'41m', breaking:false},
    {source:'NYT', cat:'Business', text:'Stock market hits record high as tech earnings exceed expectations across the board.', time:'55m', breaking:false},
    {source:'ESPN', cat:'Sports', text:'Star quarterback signs record-breaking $300M contract extension, resetting the market for the position.', time:'1h', breaking:false},
    {source:'BBC', cat:'Entertainment', text:'Award-winning director announces surprise new film, set for release this holiday season.', time:'1h', breaking:false},
    {source:'Reuters', cat:'World', text:'International summit reaches agreement on trade deal after marathon overnight negotiations.', time:'2h', breaking:false},
    {source:'CNN', cat:'Entertainment', text:'Streaming service announces record subscriber growth, stock surges in after-hours trading.', time:'2h', breaking:false},
  ];
  tweets = seed.map((s, i) => ({
    id: 't' + i,
    source: s.source,
    handle: SOURCE_HANDLES[s.source] || '@news',
    text: s.text,
    time: s.time,
    breaking: s.breaking,
    category: s.cat,
    status: 'pending'
  }));
}

function renderCatTabs() {
  document.getElementById('cat-tabs').innerHTML = CATEGORIES.map(c => {
    const count = c === 'All' ? tweets.filter(t => t.status !== 'pushed').length : tweets.filter(t => t.category === c && t.status !== 'pushed').length;
    return `<button class="cat-tab ${activeCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">${c} (${count})</button>`;
  }).join('');
}

function setCategory(c) {
  activeCategory = c;
  render();
}

const RSS_FEEDS = [
  {source: 'CNN', url: 'http://rss.cnn.com/rss/cnn_topstories.rss', cat: 'World'},
  {source: 'BBC', url: 'http://feeds.bbci.co.uk/news/rss.xml', cat: 'World'},
  {source: 'ESPN', url: 'https://www.espn.com/espn/rss/news', cat: 'Sports'},
];

const CAT_KEYWORDS = {
  Politics: ['senate', 'congress', 'election', 'vote', 'parliament', 'president', 'minister', 'bill', 'policy'],
  Business: ['stock', 'market', 'fed', 'economy', 'earnings', 'revenue', 'trade', 'dollar', 'rate'],
  Tech: ['ai', 'tech', 'software', 'chip', 'startup', 'apple', 'google', 'microsoft', 'tesla'],
  Sports: ['game', 'win', 'championship', 'playoff', 'score', 'team', 'player', 'coach', 'season'],
  Entertainment: ['film', 'movie', 'show', 'actor', 'music', 'streaming', 'hollywood', 'album'],
};

function detectCategory(text) {
  const lower = text.toLowerCase();
  for (const [cat, kws] of Object.entries(CAT_KEYWORDS)) {
    if (kws.some(kw => lower.includes(kw))) return cat;
  }
  return 'World';
}

async function scanFeeds() {
  const btn = document.querySelector('.scan-btn');
  btn.textContent = 'Scanning...';
  btn.disabled = true;
  let newCount = 0;
  const existingTitles = new Set(tweets.map(t => t.text));

  for (const feed of RSS_FEEDS) {
    try {
      // Use CORS proxy to fetch RSS
      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(feed.url);
      const resp = await fetch(proxyUrl);
      if (!resp.ok) continue;
      const xmlText = await resp.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, 'text/xml');
      const items = xml.querySelectorAll('item');
      let added = 0;
      for (let i = 0; i < Math.min(items.length, 8) && added < 5; i++) {
        const item = items[i];
        const title = item.querySelector('title')?.textContent?.trim();
        if (!title || existingTitles.has(title) || title.length < 20) continue;
        const isBreaking = /breaking|urgent|developing|just in|alert/i.test(title);
        tweets.unshift({
          id: 'rss-' + Date.now() + '-' + newCount,
          source: feed.source,
          handle: SOURCE_HANDLES[feed.source] || '@news',
          text: title,
          time: 'now',
          breaking: isBreaking,
          category: detectCategory(title),
          status: 'pending'
        });
        existingTitles.add(title);
        newCount++;
        added++;
      }
    } catch(e) {
      console.log('Feed failed:', feed.source, e.message);
    }
  }

  // Fallback: if no feeds worked, add a fresh seed story
  if (newCount === 0) {
    const fallbacks = [
      {source:'CNN', cat:'World', text:'Developing story: Major developments unfolding, updates to follow as situation progresses'},
      {source:'BBC', cat:'Politics', text:'Government announces new policy initiative following emergency cabinet meeting'},
    ];
    const fb = fallbacks[Math.floor(Math.random() * fallbacks.length)];
    tweets.unshift({
      id: 'fb-' + Date.now(),
      source: fb.source,
      handle: SOURCE_HANDLES[fb.source],
      text: fb.text,
      time: 'now',
      breaking: true,
      category: fb.cat,
      status: 'pending'
    });
    newCount = 1;
  }

  btn.textContent = '↻ Scan';
  btn.disabled = false;
  save(); render();
}

function toggleApprove(id) {
  const t = tweets.find(x => x.id === id);
  if (!t) return;
  if (approvedIds.has(id)) {
    approvedIds.delete(id);
    t.status = 'pending';
  } else {
    approvedIds.add(id);
    t.status = 'approved';
  }
  save(); render();
}

function reject(id) {
  const t = tweets.find(x => x.id === id);
  if (t) { t.status = 'rejected'; approvedIds.delete(id); }
  save(); render();
}

function pushToEPG() {
  const approved = tweets.filter(t => approvedIds.has(t.id));
  if (!approved.length) { alert('No approved stories. Click Approve on stories first.'); return; }
  // Write to format EPG Farm reads
  const bnData = {
    updated: new Date().toISOString(),
    items: approved.map(t => ({
      source: t.source,
      handle: t.handle,
      title: t.text,
      time: t.time,
      breaking: t.breaking,
      category: t.category
    }))
  };
  localStorage.setItem('epg_breaking_news', JSON.stringify(bnData));
  pushHistory.unshift({
    time: new Date().toISOString(),
    count: approved.length,
    items: approved.map(t => t.text.substring(0, 60) + '...')
  });
  // Clear approved after push
  approved.forEach(t => { t.status = 'pushed'; });
  approvedIds.clear();
  save(); render();
  alert(`Pushed ${approved.length} stories to EPG. Viewers will see them as breaking news.`);
}

function render() {
  renderCatTabs();
  const pending = tweets.filter(t => t.status === 'pending');
  const approved = tweets.filter(t => approvedIds.has(t.id));
  const filtered = tweets.filter(t => t.status !== 'pushed' && (activeCategory === 'All' || t.category === activeCategory));

  document.getElementById('stat-pending').textContent = pending.length;
  document.getElementById('stat-approved').textContent = approved.length;
  document.getElementById('stat-pushed').textContent = pushHistory.reduce((n,h) => n + h.count, 0);

  document.getElementById('tweets').innerHTML = filtered
    .map(t => {
      const color = SOURCE_COLORS[t.source] || '#555';
      const initial = t.source.charAt(0);
      const isApproved = approvedIds.has(t.id);
      return `
      <div class="tweet ${t.status === 'rejected' ? 'rejected' : ''}">
        <div class="avatar" style="background:${color}">${initial}</div>
        <div class="tweet-body">
          <div class="tweet-header">
            <span class="tweet-name">${t.source}</span>
            <span class="verified">✓</span>
            <span class="tweet-handle">${t.handle} · ${t.time}</span>
            ${t.breaking ? '<span class="breaking-badge">BREAKING</span>' : ''}
            <span class="cat-badge cat-${t.category.toLowerCase()}">${t.category}</span>
          </div>
          <div class="tweet-text">${t.text}</div>
          ${t.status !== 'rejected' ? `
          <div class="tweet-actions">
            <button class="btn btn-approve ${isApproved ? 'active' : ''}" onclick="toggleApprove('${t.id}')">
              ${isApproved ? '✓ Approved' : 'Approve'}
            </button>
            <button class="btn btn-reject" onclick="reject('${t.id}')">Dismiss</button>
          </div>` : `<div style="color:#71767b;font-size:13px;">Dismissed</div>`}
        </div>
      </div>`;
    }).join('');

  // EPG live preview - show what's currently pushed
  const epgData = JSON.parse(localStorage.getItem('epg_breaking_news') || 'null');
  document.getElementById('epg-live').innerHTML = epgData && epgData.items.length
    ? epgData.items.map(i => `
      <div class="epg-preview">
        <span class="label">BREAKING NEWS</span>
        <div style="font-weight:700;">${i.title.substring(0, 80)}${i.title.length > 80 ? '...' : ''}</div>
        <div style="font-size:12px;color:#71767b;margin-top:4px;">${i.source} · ${i.handle}</div>
      </div>`).join('')
    : '<p style="color:#71767b;font-size:14px;">Nothing on EPG. Approve stories and push.</p>';

  document.getElementById('push-btn').disabled = !approved.length;
  document.getElementById('push-btn').textContent = approved.length
    ? `Push ${approved.length} to EPG`
    : 'Push Approved to EPG';

  document.getElementById('history').innerHTML = pushHistory.slice(0, 10).map(h => `
    <div class="history-item">
      <div class="time">${new Date(h.time).toLocaleString()}</div>
      <div>Pushed ${h.count} stories</div>
      <div style="color:#71767b;">${h.items[0]}</div>
    </div>`).join('') || '<p style="color:#71767b;font-size:14px;">No pushes yet.</p>';
}

load();
</script>
</body>
</html>
